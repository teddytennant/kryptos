# Kryptos configuration — copy to ~/.config/kryptos/config.toml.
# Saving the file triggers a hot-reload; no restart required.

[general]
# Built-in: "catppuccin-mocha", "catppuccin-latte", "catppuccin-frappe",
# "catppuccin-macchiato", "gruvbox", "gruvbox-light", "tokyo-night",
# "tokyo-night-storm", "everforest-dark", "everforest-dark-soft",
# "everforest-light", "everforest-light-soft", "system" (follow GTK
# light/dark), or any name registered via :theme.
theme = "catppuccin-mocha"
# Leader prefix for compound bindings (e.g. <Space>c -> compose_new).
leader_key = "<Space>"
# Open the window maximised at launch.
start_maximized = true
# Enable Hyprland blur via ext-session-lock / wlr-layer-shell hints.
hyprland_blur = true

[keymap.normal]
"j" = "navigate_down"
"k" = "navigate_up"
"h" = "sidebar_focus"
"l" = "messages_focus"
"gg" = "scroll_top"
"G" = "scroll_bottom"
"<Space>c" = "compose_new"
"<Space>r" = "reply"
"dd" = "archive_chat"
"yy" = "copy_message"
"x" = "delete_message"
"/" = "search"
":" = "command_palette"

[keymap.insert]
"<Esc>" = "leave_insert"
"<C-Enter>" = "send_message"

[keymap.command]
"q" = "quit"
"theme" = "set_theme"             # :theme catppuccin-latte
"reload" = "reload_config"

[notifications]
enabled = true
sound = "default"
# Per-chat DND overrides global notifications.
dnd_per_chat = true

[appearance]
font = "Inter 11"
message_bubbles = true

# Messenger backends. Signal (signal-cli over D-Bus) is the default;
# Telegram support uses grammers-client and is opt-in.
[backends.signal]
enabled = true

[backends.telegram]
enabled = false
# Get api_id / api_hash from https://my.telegram.org → API development tools.
api_id = 0
api_hash = ""
# Where grammers-session persists the auth blob. Empty means
# $XDG_DATA_HOME/kryptos/telegram.session.
session_path = ""

# First-run onboarding bookkeeping. Once the welcome flow finishes (or
# the user clicks "Skip onboarding") this flips to true and the welcome
# window is never shown again.
[onboarding]
completed = false
