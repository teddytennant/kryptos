[package]
name = "kryptos"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A vim-first Signal desktop client for Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/teddytennant/kryptos"
keywords = ["signal", "messenger", "vim", "gtk4", "libadwaita"]
categories = ["gui"]

[dependencies]
# UI
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
relm4 = { version = "0.9", features = ["libadwaita"] }

# D-Bus to signal-cli
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Telegram (MTProto) backend
grammers-client = "0.7"
grammers-session = "0.7"
grammers-tl-types = "0.7"
# `grammers` exposes message timestamps as `chrono::DateTime<Utc>`. We
# already pull chrono in transitively, but list it directly so the
# conversion module can name the type without `cfg(grammers)` games.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "signal"] }
futures-util = "0.3"
async-trait = "0.1"

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
notify = "6"  # filesystem watcher used for hot-reload

# Local cache
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Notifications
notify-rust = "4"

# QR rendering for the device-link onboarding flow. Default features
# (image / svg) stay off — we draw the matrix straight to a Cairo
# DrawingArea, so no encoder needs to be pulled in.
qrcode = { version = "0.14", default-features = false }

# Logging / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
